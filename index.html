    <script>
      (function() {
        try {
          var origFetch = window.fetch;
          if (typeof origFetch === 'function') {
            var _activeFetch = function() {
              return origFetch.apply(window, arguments);
            };
            try {
              Object.defineProperty(window, 'fetch', {
                get: function() {
                  return _activeFetch;
                },
                set: function(fn) {
                  if (typeof fn === 'function') {
                    _activeFetch = fn;
                  }
                },
                configurable: true,
                enumerable: true
              });
            } catch (err1) {
              try {
                Object.defineProperty(Window.prototype, 'fetch', {
                  get: function() {
                    return _activeFetch;
                  },
                  set: function(fn) {
                    if (typeof fn === 'function') {
                      _activeFetch = fn;
                    }
                  },
                  configurable: true,
                  enumerable: true
                });
              } catch (err2) {}
            }
          }
        } catch (e) {
          console.warn('Fetch setter initialization:', e);
        }

        // Catch non-critical unhandled errors from external/sandbox scripts
        window.addEventListener('error', function(event) {
          if (event && event.message && event.message.indexOf('fetch') !== -1 && event.message.indexOf('getter') !== -1) {
            event.preventDefault();
            return true;
          }
        });
      })();
    </script>
